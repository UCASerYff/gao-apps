name: 更新最新安装包链接

on:
  schedule:
    - cron: "17 * * * *"   # 每小时一次
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: update-latest
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 拉取八个仓库的 latest release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/update_latest.py
      - name: 重新生成页面
        run: python3 tools/build_site.py
      - name: 有变化时提交
        run: |
          if git diff --quiet -- data index.html 404.html */index.html; then
            echo "安装包没有变化"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data index.html 404.html */index.html
          git commit -m "更新最新安装包链接"
          git push
